name: EXP Leaderboard Sweep

# Once-daily crawler that snapshots the MSU ranking leaderboard into the DB.
#
# Primary trigger is Vercel Cron (see vercel.json), which fires on time and
# dispatches this workflow via API — GitHub's own `on: schedule` is best-effort
# and routinely fires hours late at the top of the UTC day. The 12:40-UTC
# schedule below stays only as a dedup-safe fallback in case Vercel ever misses.
# Inert until DATABASE_URL is configured in repo secrets.

on:
  schedule:
    - cron: "40 12 * * *" # 12:40 UTC — fallback only; dedup makes it a no-op unless the primary run failed
  workflow_dispatch:

# Avoid overlapping runs.
concurrency:
  group: exp-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Sweep is ~57 min at the polite 5s/page pacing. 120 min gives headroom for
    # MSU slowness / 429 backoffs so the run completes instead of being cancelled
    # at the timeout. Pacing is left at 5s deliberately to avoid rate-limiting.
    timeout-minutes: 120
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SWEEP_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Run sweep
        run: npm run sweep
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RANKING_TOP_N: ${{ vars.RANKING_TOP_N || '6844' }}
          MIN_LEVEL: ${{ vars.MIN_LEVEL || '230' }}
          SWEEP_DELAY_MS: ${{ vars.SWEEP_DELAY_MS || '5000' }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS || '120' }}
